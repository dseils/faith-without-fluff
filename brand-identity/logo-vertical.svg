<?xml version="1.0" encoding="UTF-8"?>
<svg width="300" height="150" viewBox="0 0 300 150" xmlns="http://www.w3.org/2000/svg">
  <!-- FWF Logo - Vertical -->
  
  <!-- Cairn mark -->
  <g transform="translate(150, 55)">
    <!-- Bottom stone -->
    <ellipse cx="0" cy="20" rx="30" ry="17" fill="#6B6B6B"/>
    <ellipse cx="0" cy="17" rx="27" ry="15" fill="#7A7A7A"/>
    
    <!-- Middle stone -->
    <ellipse cx="-1" cy="-5" rx="22" ry="13" fill="#7A7A7A"/>
    <ellipse cx="-1" cy="-7" rx="19" ry="11" fill="#8A8A8A"/>
    
    <!-- Top stone -->
    <ellipse cx="0" cy="-28" rx="12" ry="8" fill="#8A8A8A"/>
    <ellipse cx="0" cy="-29" rx="10" ry="7" fill="#9A9A9A"/>
  </g>
  
  <!-- Logotype -->
  <text x="150" y="115" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="400" fill="#3D3D3D">Faith Without</text>
  <text x="150" y="140" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="400" fill="#7A8B7C">the Fluff</text>
</svg>