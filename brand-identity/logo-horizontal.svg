<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="100" viewBox="0 0 400 100" xmlns="http://www.w3.org/2000/svg">
  <!-- FWF Primary Logo - Horizontal -->
  
  <!-- Cairn mark -->
  <g transform="translate(40, 50)">
    <!-- Bottom stone -->
    <ellipse cx="0" cy="20" rx="25" ry="14" fill="#6B6B6B"/>
    <ellipse cx="0" cy="18" rx="23" ry="12" fill="#7A7A7A"/>
    
    <!-- Middle stone -->
    <ellipse cx="-1" cy="-2" rx="18" ry="11" fill="#7A7A7A"/>
    <ellipse cx="-1" cy="-4" rx="16" ry="9" fill="#8A8A8A"/>
    
    <!-- Top stone -->
    <ellipse cx="0" cy="-20" rx="10" ry="7" fill="#8A8A8A"/>
    <ellipse cx="0" cy="-21" rx="8" ry="6" fill="#9A9A9A"/>
  </g>
  
  <!-- Logotype -->
  <text x="90" y="58" font-family="Georgia, serif" font-size="28" font-weight="400" fill="#3D3D3D">Faith Without</text>
  <text x="245" y="58" font-family="Georgia, serif" font-size="28" font-weight="400" fill="#7A8B7C">the Fluff</text>
</svg>